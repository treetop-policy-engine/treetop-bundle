[graph]
all-features = true

[advisories]
db-path = ".cargo-deny/advisory-dbs"
ignore = []

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.93
# Required by serde_json's ordered maps in Cedar. Review any version change.
exceptions = [{ crate = "foldhash@=0.2.0", allow = ["Zlib"] }]

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
required-git-spec = "rev"
