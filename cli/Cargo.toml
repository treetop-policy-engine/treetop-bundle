[package]
name = "treetop-bundle-cli"
version = "0.0.3"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[[bin]]
name = "treetop-bundle"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
rpassword = "7.5.4"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
treetop-bundle = { path = "..", version = "=0.0.3" }
zeroize = "1.9.0"

[dev-dependencies]
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
pkcs8 = { version = "0.10.2", features = ["encryption", "pem"] }
tempfile = "3.21.0"
