[package]
name = "treetop-bundle-cli"
version = "0.0.1"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[[bin]]
name = "treetop-bundle"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.5.47", features = ["derive"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
treetop-bundle = { path = "..", version = "=0.0.1" }

[dev-dependencies]
tempfile = "3.21.0"
