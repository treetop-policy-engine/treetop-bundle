[package]
name = "treetop-bundle-cli"
version = "0.0.7"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
publish = false

[[bin]]
name = "treetop-bundle"
path = "src/main.rs"
doc = false

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
rpassword = "7.5.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
treetop-bundle = { path = "..", version = "=0.0.7" }
zeroize = "1.9.0"

[dev-dependencies]
ed25519-dalek = { version = "3.0.0", features = ["pem", "pkcs8"] }
pkcs8 = { version = "0.11.0", features = ["encryption", "pem"] }
tempfile = "3.27.0"
