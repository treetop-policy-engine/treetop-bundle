name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
  RUSTDOCFLAGS: "-D warnings"

jobs:
  verify:
    name: Verify release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Verify tag version and main ancestry
        shell: bash
        run: |
          version="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "treetop-bundle") | .version')"
          if [[ "$GITHUB_REF_NAME" != "v${version}" ]]; then
            echo "Tag $GITHUB_REF_NAME does not match treetop-bundle ${version}." >&2
            exit 1
          fi
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Release commit is not on origin/main." >&2
            exit 1
          fi
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@49a0bdc70d2e1b713ca9e2869b211fcce03d3c1c # v2
      - name: Verify source
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
          cargo test --locked --workspace --all-features
          cargo doc --locked --workspace --all-features --no-deps
          cargo publish --locked -p treetop-bundle --dry-run

  publish:
    name: Publish library
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
      - name: Check whether the crate version exists
        id: published
        shell: bash
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --retry 3 --retry-all-errors --connect-timeout 10 --max-time 30 \
            --header 'User-Agent: treetop-bundle release workflow' \
            "https://crates.io/api/v1/crates/treetop-bundle/${GITHUB_REF_NAME#v}")"
          case "$status" in
            200) echo "published=true" >> "$GITHUB_OUTPUT" ;;
            404) echo "published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "Unexpected crates.io response $status." >&2; exit 1 ;;
          esac
      - name: Authenticate to crates.io
        if: steps.published.outputs.published != 'true'
        id: auth
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish treetop-bundle
        if: steps.published.outputs.published != 'true'
        run: cargo publish --locked -p treetop-bundle
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}

  binaries:
    name: Build ${{ matrix.target }} CLI
    needs: publish
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-musl
            archive: treetop-bundle-x86_64-linux-musl.tar.gz
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            archive: treetop-bundle-aarch64-linux-musl.tar.gz
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            archive: treetop-bundle-x86_64-macos.tar.gz
          - runner: macos-15
            target: aarch64-apple-darwin
            archive: treetop-bundle-aarch64-macos.tar.gz
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            archive: treetop-bundle-x86_64-windows.zip
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            archive: treetop-bundle-aarch64-windows.zip
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9 # v1
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      - name: Install musl tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --yes musl-tools
      - name: Build CLI
        run: cargo build --locked --release --target ${{ matrix.target }} -p treetop-bundle-cli
      - name: Smoke-test and package Unix CLI
        if: runner.os != 'Windows'
        shell: bash
        run: |
          binary="target/${{ matrix.target }}/release/treetop-bundle"
          "$binary" --version
          mkdir release-artifacts
          tar czf "release-artifacts/${{ matrix.archive }}" \
            -C "$(dirname "$binary")" treetop-bundle
      - name: Smoke-test and package Windows CLI
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $binary = "target/${{ matrix.target }}/release/treetop-bundle.exe"
          & $binary --version
          New-Item -ItemType Directory -Path release-artifacts
          Compress-Archive -LiteralPath $binary `
            -DestinationPath "release-artifacts/${{ matrix.archive }}"
      - name: Upload CLI archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: cli-${{ matrix.target }}
          path: release-artifacts/${{ matrix.archive }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: Publish CLI archives
    needs: binaries
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download CLI archives
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5.0.0
        with:
          pattern: cli-*
          path: release-artifacts
          merge-multiple: true
      - name: Create checksum manifest
        working-directory: release-artifacts
        run: sha256sum treetop-bundle-* > SHA256SUMS
      - name: Create GitHub release
        uses: ncipollo/release-action@339a81892b84b4eeb0f6e744e4574d79d0d9b8dd # v1.21.0
        with:
          tag: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generateReleaseNotes: true
          artifacts: "release-artifacts/*"
