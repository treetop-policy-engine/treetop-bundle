name: Fuzz

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu
  FUZZ_TIME: ${{ github.event_name == 'pull_request' && '60' || '900' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [archive, manifest, signature, labels]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: nightly
      - name: Validate the committed fuzz lockfile
        run: cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@75a7c0f87bd666af3cdb75c5b9e9d03ab6044e6f # v2.90.6
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build fuzz target
        run: >-
          cargo +nightly fuzz build
          --target "$FUZZ_BUILD_TARGET"
          "${{ matrix.target }}"
      - name: Run fuzz target
        run: >-
          cargo +nightly fuzz run
          --target "$FUZZ_BUILD_TARGET"
          "${{ matrix.target }}" --
          -max_len=65536
          -max_total_time="$FUZZ_TIME"
          -timeout=10
      - name: Verify fuzzing preserved the lockfile
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
