name: Fuzz

on:
  pull_request:
    branches: ["main"]
  schedule:
    - cron: "23 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_FUZZ_VERSION: "0.13.2"
  FUZZ_BUILD_TARGET: x86_64-unknown-linux-gnu
  FUZZ_TIME: ${{ github.event_name == 'pull_request' && '60' || '900' }}

jobs:
  fuzz:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [archive, manifest, signature, labels]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: nightly
      - name: Validate the committed fuzz lockfile
        run: cargo +nightly metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Install cargo-fuzz
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-fuzz@0.13.2
      - name: Build fuzz target
        run: >-
          cargo +nightly fuzz build
          --target "$FUZZ_BUILD_TARGET"
          "${{ matrix.target }}"
      - name: Run fuzz target
        run: >-
          cargo +nightly fuzz run
          --target "$FUZZ_BUILD_TARGET"
          "${{ matrix.target }}" --
          -max_len=65536
          -max_total_time="$FUZZ_TIME"
          -timeout=10
      - name: Verify fuzzing preserved the lockfile
        run: git diff --exit-code -- fuzz/Cargo.lock
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: fuzz-${{ matrix.target }}-${{ github.sha }}
          path: fuzz/artifacts
          if-no-files-found: ignore
