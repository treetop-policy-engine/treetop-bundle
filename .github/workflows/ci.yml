name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  quality:
    name: Format, lint, test, audit, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate the committed fuzz lockfile
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests and doctests
        run: cargo test --locked --workspace --all-features
      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.23.2 --config .markdownlint.json "**/*.md" "!target"
      - name: Install cargo-audit
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-audit@0.22.2
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@9114bf4d891761788c546334fd37538eae1bf8b3 # v2.87.16
        with:
          tool: cargo-deny@0.20.2
      - name: Fetch cargo-deny advisory database
        run: cargo deny fetch db
      - name: Check dependency and license policy
        run: cargo deny --locked check advisories bans licenses sources
      - name: Verify published package contents
        run: cargo package --locked -p treetop-bundle
      - name: Smoke-test release CLI
        run: |
          cargo build --locked --release -p treetop-bundle-cli
          target/release/treetop-bundle --version

  msrv:
    name: Rust 1.93.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@02cb101ec7c40f2c49e1d9714d64511d8e1b74de # master
        with:
          toolchain: 1.93.1
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - name: Check MSRV
        run: cargo check --locked --workspace --all-features
