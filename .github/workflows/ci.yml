name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTDOCFLAGS: "-D warnings"

jobs:
  quality:
    name: Format, lint, test, audit, and package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: stable
          components: clippy, rustfmt
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check formatting
        run: cargo fmt --all --check
      - name: Validate the committed fuzz lockfile
        run: cargo metadata --locked --manifest-path fuzz/Cargo.toml --format-version 1 > /dev/null
      - name: Run Clippy
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Run tests and doctests
        run: cargo test --locked --workspace --all-features
      - name: Build documentation
        run: cargo doc --locked --workspace --all-features --no-deps
      - name: Lint Markdown
        run: npx --yes markdownlint-cli2@0.24.2 --config .markdownlint.json "**/*.md" "!target"
      - name: Install cargo-audit
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-audit@0.23.0
      - name: Audit dependencies
        run: cargo audit --deny warnings
      - name: Install cargo-deny
        uses: taiki-e/install-action@fe3acb53a98b62c772db35de75ce0e4595e7ca8c # v2.90.8
        with:
          tool: cargo-deny@0.22.1
      - name: Fetch cargo-deny advisory database
        run: cargo deny fetch db
      - name: Check dependency and license policy
        run: cargo deny --locked check advisories bans licenses sources
      - name: Verify published package contents
        run: cargo package --locked -p treetop-bundle
      - name: Smoke-test release CLI
        run: |
          cargo build --locked --release -p treetop-bundle-cli
          target/release/treetop-bundle --version

  msrv:
    name: Rust 1.93.1
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Rust 1.93.1
        uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master
        with:
          toolchain: 1.93.1
      - name: Cache Cargo artifacts
        uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Check MSRV
        run: cargo check --locked --workspace --all-features
