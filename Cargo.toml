[package]
name = "treetop-bundle"
version = "0.0.2"
edition = "2024"
rust-version = "1.93.1"
license = "MIT"
description = "Deterministic compiler and verifier for Treetop policy bundles"
repository = "https://github.com/treetop-policy-engine/treetop-bundle"
readme = "README.md"
keywords = ["cedar", "policy", "authorization", "bundle"]
categories = ["authentication", "command-line-utilities"]
include = [
    "/src/**",
    "/tests/**",
    "/Cargo.lock",
    "/Cargo.toml",
    "/CHANGELOG.md",
    "/LICENSE",
    "/README.md",
]

[workspace]
members = ["cli"]
exclude = ["fuzz"]
resolver = "3"

[dependencies]
base64 = "0.22.1"
cedar-policy = "=4.12.0"
ed25519-dalek = { version = "2.2.0", features = ["pem", "pkcs8"] }
flate2 = "1.1.2"
regex = "1.12.2"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.143"
sha2 = "0.10.9"
tar = "0.4.44"
thiserror = "2.0.16"
toml = "0.9.5"
treetop-core = "=0.0.21"

[dev-dependencies]
tempfile = "3.21.0"

[lints.rust]
unsafe_code = "forbid"
